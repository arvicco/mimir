<!DOCTYPE html>
<!--
  index.html -- mimir production dashboard (work packet M4-3).
  One screen, no navigation: what is the tape saying now, and how fresh is
  the data behind it? Consumes the Worker API SAME-ORIGIN --
    GET /api/v1/index      -> the key list (per-key generated_at)
    GET /api/v1/<key>      -> one chart envelope, VERBATIM
    GET /healthz           -> worker liveness (drives the failure banner)
  Rendering (staleness math, hover bubbles, hook registries, card DOM) is
  the shared renderer render.js -- IDENTICAL to preview.html. This page owns
  only its transport (same-origin fetch), the one-line header (name + per-key
  chips + pub/fresh slot), the failure banner, and THE SIGNATURE: a single
  1 s age ticker driving every card badge (data-generated-at / data-ttl).

  SERVE for offline review (rake preview shims /api/v1 + /healthz over
  data/publish_preview/): from the repo root run `rake preview`, then open
  http://localhost:8000/web/index.html . In production the Worker route
  answers /api/v1 and this file is served same-origin.

  ECharts is pinned to ONE exact CDN version (SAME as preview.html). The pin
  is deliberate; bump it only intentionally, on both pages together.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mimir</title>
<!-- Pinned ECharts. Do not float this version; update only on purpose.
     SRI pin: integrity= + crossorigin= below lock the exact artifact.
     Recompute with: curl -sL <url> | openssl dgst -sha384 -binary | base64 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"
        integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss"
        crossorigin="anonymous"></script>
<!-- Shared renderer (staleness math, hover bubbles, hook registries, card
     builder). ONE source for preview.html and this production dashboard. -->
<script src="render.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: #14171c; color: #d7dce3;
    /* prose face -- titles, bubbles, copy */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
  }
  /* data face -- EVERY number / status token (chips, badges, ages, pub slot),
     tabular so ticking values never jitter. */
  .chip, .badge, .age, #pub {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  /* Header tightens preview's two rows into ONE line: name, per-key chips,
     then the pub/fresh slot pushed right. Chips clip rather than wrap. */
  #head {
    display: flex; align-items: baseline; gap: 0 14px;
    flex-wrap: nowrap; white-space: nowrap;
    position: relative; /* anchors #livebubble */
    margin-bottom: 12px;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 0 0 auto; }
  /* liveness cluster: dot-only (owner ruling 2026-07-06 -- the key@time
     text lives in a hover/focus bubble per dot), right-aligned before
     the pub slot */
  #chips {
    display: flex; align-items: center; gap: 0 7px;
    flex: 0 0 auto; margin-left: auto;
  }
  #pub { flex: 0 0 auto; color: #c3cad4; white-space: nowrap; }
  .ldot {
    width: 10px; height: 10px; border-radius: 50%;
    border: 0; padding: 0; cursor: help; display: inline-block;
  }
  .ldot:focus-visible { outline: 2px solid #e6a23c; outline-offset: 2px; }
  /* one shared bubble under the cluster, right-anchored to the header so
     it can never clip at the viewport edge (mimir-design: overlays never
     clip); content = the hovered dot's key@time */
  #livebubble {
    display: none; position: absolute; right: 0; top: calc(100% + 4px);
    z-index: 40; background: #232933; border: 1px solid #3a424e;
    border-radius: 6px; padding: 5px 10px; font-size: 11px;
    color: #ccd3dc; box-shadow: 0 6px 24px rgba(0,0,0,.45);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .green { background: #35c46a; } .amber { background: #e2a52b; } .red { background: #e04b4b; }
  #banner {
    display: none; background: #4a1414; border: 1px solid #a33;
    color: #ffd7d7; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px;
    font-size: 12px; line-height: 1.5;
  }
  /* 3x2 card grid (owner ruling 2026-08-10): row 1 GEX · Volatility ·
     Vol-Spread, row 2 Scenario · LPPL · BTCo. Order comes from
     render.js CARD_ORDER; narrower viewports fall back 2-col, then 1. */
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 1160px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 780px)  { .grid { grid-template-columns: 1fr; } }
  .stacksec { position: relative; } /* bubble + badge anchor per stacked section (owner ruling 2026-08-10) */
  .card {
    background: #1b1f26; border: 1px solid #2a2f38; border-radius: 8px;
    padding: 10px 12px; min-width: 0; position: relative;
  }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card-head .key { font-weight: 600; font-size: 13px; }
  /* Instant structured hover bubble (native title= tooltips are slow and
     unformattable). Anchored inside the card; opens on hover OR keyboard
     focus of the title/info affordance. */
  .hover { cursor: help; }
  .key.hover { text-decoration: underline dotted #4a515c; text-underline-offset: 3px; }
  .info { font-size: 12px; color: #7f8896; cursor: help; }
  .bubble {
    display: none; position: absolute; left: 10px; right: 10px; top: 34px;
    z-index: 40; background: #232933; border: 1px solid #3a424e;
    border-radius: 8px; padding: 10px 14px; font-size: 12px; line-height: 1.55;
    color: #ccd3dc; box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble .lbl { color: #8fa3bd; font-weight: 600; }
  /* flipped upward by render.js when the default position would clip at
     the viewport bottom (bottom-row cards) -- opens above the head */
  .bubble.up { top: auto; bottom: calc(100% - 26px); }
  /* focus opens the bubble only from the elements that own it (.hover =
     key/info) -- :focus-within on the whole head pinned the bubble open
     over the chart whenever a GEX tab button was clicked (owner report,
     Gate 6 preview) */
  .card-head:has(.hover:hover) ~ .bubble,
  .card-head:has(.hover:focus) ~ .bubble,
  .bubble:hover { display: block; }
  .info:focus-visible { outline: 2px solid #e6a23c; outline-offset: 2px; }
  /* Title ⓘ affordance + instant orientation bubble (M8-7). SAME instant
     CSS hover/focus pattern as the card-head bubbles (never native title=).
     It sits at the top of the page, so it opens DOWNWARD and can never clip
     at the top; anchored to the header's left edge and width-capped so it
     can't clip at the right either (mimir-design: overlays never clip). */
  #titleinfo {
    font-size: 12px; color: #7f8896; cursor: help; flex: 0 0 auto;
    margin-left: -8px; /* pull it close to the title (header gap is 14px) */
  }
  #titleinfo:focus-visible { outline: 2px solid #e6a23c; outline-offset: 2px; border-radius: 3px; }
  #titlebubble {
    display: none; position: absolute; left: 0; top: calc(100% + 4px);
    z-index: 50; width: max-content; max-width: min(360px, 92vw);
    background: #232933; border: 1px solid #3a424e; border-radius: 8px;
    padding: 10px 14px; font-size: 12px; line-height: 1.55; color: #ccd3dc;
    box-shadow: 0 6px 24px rgba(0,0,0,.45); white-space: normal;
  }
  #titlebubble p { margin: 0 0 8px; }
  #titlebubble p:last-child { margin-bottom: 0; }
  #titlebubble .links { display: flex; gap: 16px; }
  #titlebubble a { color: #a9d1ff; text-decoration: none; }
  #titlebubble a:hover, #titlebubble a:focus { text-decoration: underline; }
  #titlebubble a:focus-visible { outline: 2px solid #e6a23c; outline-offset: 2px; border-radius: 2px; }
  /* open on hover/focus of the ⓘ, and stay open while the pointer is over
     the bubble OR keyboard focus is inside it (so its two links are Tab-
     reachable -- the card bubbles carry no links, this one does) */
  #head:has(#titleinfo:hover) #titlebubble,
  #head:has(#titleinfo:focus) #titlebubble,
  #titlebubble:hover, #titlebubble:focus-within { display: block; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; margin-left: auto;
    font-size: 11px; padding: 2px 8px; border-radius: 20px;
    border: 1px solid #2a2f38; color: #b9c0ca;
  }
  .chart { width: 100%; height: 500px; }
  /* GEX tab bar (M6-4, owner ruling D7-c): the two GEX charts share one
     card as [BTC][MSTR] tabs. Real <button>s in the card-head, dim until
     active / bright when owning (the .sortbtn pattern), amber focus ring. */
  .tabbar { display: inline-flex; gap: 4px; }
  .tabbtn {
    cursor: pointer; padding: 1px 8px; border-radius: 5px;
    background: none; border: 1px solid #2a2f38;
    font: inherit; font-size: 11px; color: #7f8896;
  }
  .tabbtn.active { color: #d7dce3; border-color: #3a424e; background: #20252d; }
  .tabbtn:focus-visible { outline: 2px solid #e6a23c; outline-offset: 2px; }
  /* Grouped (p) VENUE (c) legend widget (meta.legend_widget hook) --
     one line per venue over the chart's right margin. Bright = shown,
     dim = hidden; sides keep their series colors. */
  .cp-legend {
    position: absolute; right: 16px; top: 68px; z-index: 30;
    display: flex; flex-direction: column; gap: 4px;
    font-size: 11px; line-height: 1.3; user-select: none; text-align: center;
  }
  .cp-row { white-space: nowrap; }
  /* Reset the real <button> (render.js) back to inline text -- keyboard
     operable but identical to the old <span>. */
  .cp {
    cursor: pointer; padding: 0 1px; background: none; border: 0;
    font: inherit; color: inherit; vertical-align: baseline; line-height: inherit;
  }
  .cp:focus-visible { outline: 2px solid #e6a23c; outline-offset: 2px; }
  .cp-p { color: #ef6b6b; }
  .cp-c { color: #2fbf8f; }
  .cp-v { color: #d7dce3; font-weight: 600; }
  .cp.off { color: #4a515c; }
  /* BTCo universe table (M4-7): a compact full-width strip appended below
     the four charts (grid-column 1 / -1). Borderless except a 1px row
     separator; mono tabular numerals at 11px; click-to-sort headers are
     real <button>s (bright = the sorted column, dim = the rest). Density
     is the point -- all rows, no pagination, no scroll region. */
  .card.wide { grid-column: 1 / -1; }
  table.btco { width: 100%; border-collapse: collapse; margin-top: 8px; }
  table.btco th, table.btco td { padding: 4px 10px; text-align: right; white-space: nowrap; }
  table.btco th.tick, table.btco td.tick { text-align: left; }
  table.btco td, table.btco th.num {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; font-size: 11px;
  }
  table.btco thead th { font-size: 11px; font-weight: 600; vertical-align: bottom; }
  table.btco tbody tr { border-top: 1px solid #2a2f38; }
  table.btco tbody tr:hover { background: #20252d; }
  table.btco .dim { color: #5b636e; }           /* null cells render a dim -- */
  table.btco .fl-st { color: #e04b4b; }          /* STALE flag */
  table.btco .fl-ph { color: #e2a52b; }          /* placeholder * flag */
  /* Header sort control: dim until it owns the sort, then it brightens. */
  .sortbtn {
    cursor: pointer; padding: 0; background: none; border: 0;
    font: inherit; color: #7f8896; white-space: nowrap;
  }
  .sortbtn.active { color: #d7dce3; }
  .sortbtn:focus-visible { outline: 2px solid #e6a23c; outline-offset: 2px; }
  .card.err { border-color: #a33; background: #2a1616; }
  .card.err .msg { color: #ffb3b3; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
  <div id="head">
    <h1>mimir</h1>
    <span id="titleinfo" role="button" tabindex="0" aria-label="About this dashboard and how to read it">ⓘ</span>
    <span id="chips"></span>
    <span id="pub"></span>
    <div id="livebubble" role="status"></div>
    <div id="titlebubble" role="region" aria-label="About mimir">
      <p>mimir is a personal Bitcoin analytics dashboard: four instrument families computed on a private machine and published as pre-built charts every two hours. This page is a dumb renderer &mdash; it draws the last publish and computes nothing itself.</p>
      <p class="links">
        <a href="guide.html">How to read this dashboard &rarr;</a>
        <a href="https://github.com/arvicco/mimir/blob/main/docs/METHODOLOGY.md">Methodology &rarr;</a>
      </p>
    </div>
  </div>
  <div id="banner"></div>
  <div id="grid" class="grid"></div>

<script>
"use strict";
// The dashboard is a dumb loader over the shared renderer (render.js): it
// owns same-origin transport, the one-line header, the failure banner, and
// the page-wide age ticker. All chart rendering lives in window.MimirRender.
var R = window.MimirRender;

// ---- config -----------------------------------------------------------
var API = "/api/v1/";                 // Worker route (same-origin)
function apiUrl(key) { return API + key; }  // key may contain ':' (valid path char)

// Which producer publishes each chart key -- for the 404 failure copy.
var PRODUCERS = {
  gex_profile:    "gex_btc_combined.rb",
  gex_mstr:       "gex_us.rb",
  scenario_strip: "scenario.rb",
  lppl_regime:    "lppl.rb",
  btco_table:     "btco.rb",
  vol_surface:    "vol.rb",
  vol_surface_mstr: "vol_mstr.rb",
  vol_spread:     "vol_spread.rb",
  vol_spread_trend: "vol_spread.rb",
  vol_basis:      "basis.rb",
  gex_trend:      "gex_trend.rb"
};

async function getJSON(url) {
  var r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status + " " + r.statusText);
  return r.json();
}

// ---- failure banner ---------------------------------------------------
// Directive, not mood: names the missing endpoint and the exact curl.
function showBanner() {
  var b = document.getElementById("banner");
  b.style.display = "block";
  b.textContent = "API unreachable -- charts show nothing until /api/v1/index answers. " +
                  "Check the Worker: curl https://" + location.host + "/healthz.";
}

async function probeHealthz() {
  try { var h = await getJSON("/healthz"); return !!(h && h.ok); }
  catch (e) { return false; }
}

// ---- one-line header --------------------------------------------------
// Per-key chips (dot + key@HH:MM), then the right slot: pub = newest
// generated_at over all published keys (HH:MMZ), and n/N fresh where n
// counts keys whose staleness class is green. The universe of keys is every
// published envelope -- the index rows PLUS the index envelope itself (the
// 11th key: 10 rows are "everything except index"). The index rows carry
// only key + generated_at, so each chip/count uses the INDEX envelope's ttl
// (the MIN across published keys); per-CARD badges below use each chart's
// own ttl. Chips are drawn for the rows only (index has no card).
function buildHeader(idx) {
  // shared with preview.html via the renderer (unified view, owner ruling
  // 2026-07-06) -- dot cluster, bubble wiring, pub/fresh slot, chart keys
  return R.liveHeader({
    chipsEl: document.getElementById("chips"),
    bubbleEl: document.getElementById("livebubble"),
    pubEl: document.getElementById("pub"),
    idx: idx
  });
}

// ---- THE SIGNATURE: live age ticker -----------------------------------
// One shared 1 s interval (cheap, whole-page) rewrites every card badge's
// age and re-evaluates its staleness dot from data-generated-at/data-ttl.
// prefers-reduced-motion: this is a text update only -- no other animation
// exists on the page, so nothing to disable.
function fmtAge(sec) {
  var s = Math.floor(sec < 0 ? 0 : sec);
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  if (s < 3600)  return Math.floor(s / 60) + "m" + p2(s % 60) + "s";
  if (s < 86400) return Math.floor(s / 3600) + "h " + p2(Math.floor((s % 3600) / 60)) + "m";
  return Math.floor(s / 86400) + "d " + p2(Math.floor((s % 86400) / 3600)) + "h";
}

function paintBadge(badge) {
  var gen = badge.getAttribute("data-generated-at");
  var ttl = Number(badge.getAttribute("data-ttl"));
  badge.querySelector(".dot").className = "dot " + R.staleClass(gen, ttl);
  badge.querySelector(".age").textContent = fmtAge((Date.now() - new Date(gen).getTime()) / 1000);
}

function tickAll() {
  var badges = document.querySelectorAll("#grid .badge[data-generated-at]");
  for (var i = 0; i < badges.length; i += 1) paintBadge(badges[i]);
}

// Replace render.js's static badge text with the ticking dot + age, keyed
// off data attributes the shared ticker scans.
function initBadge(card, env) {
  // A stacked card (group_style 'stack') carries one badge PER section,
  // each already stamped with its own envelope's data attributes by the
  // renderer -- honor those; fall back to the passed env for the solo/
  // tab card whose single badge is unstamped on first build.
  var badges = card.querySelectorAll(".badge");
  for (var i = 0; i < badges.length; i += 1) {
    var badge = badges[i];
    if (!badge.getAttribute("data-generated-at")) {
      badge.setAttribute("data-generated-at", env.generated_at);
      badge.setAttribute("data-ttl", env.ttl_hint_s);
    }
    badge.innerHTML = '<span class="dot"></span><span class="age"></span>';
    paintBadge(badge);
  }
}

// ---- one chart card ---------------------------------------------------
function chartErr(key, e) {
  var short = key.replace(/^chart:/, "");
  var producer = PRODUCERS[short];
  var msg;
  if (/HTTP 404/.test(e.message) && producer) {
    msg = key + " -- 404 not found. Published by " + producer + "; run it, then publish.";
  } else if (producer) {
    msg = "fetch/parse failed (" + e.message + "). " + key + " is published by " + producer + ".";
  } else {
    msg = "fetch/parse failed: " + e.message;
  }
  return R.errCard(key, msg);
}

async function loadChart(key) {
  var grid = document.getElementById("grid");
  var env;
  try {
    env = await getJSON(apiUrl(key));
  } catch (e) {
    grid.appendChild(chartErr(key, e));
    return;
  }
  try {
    var card = R.buildChartCard(env, key);
    // A tab-group's 2nd+ member (M6-4) returns the SAME, already-connected
    // card: re-appending would MOVE it and break the 2x2 grid order, and
    // re-initBadge would point the shared badge at the wrong tab's env
    // (the renderer's tab machinery owns the badge swap). Guard both.
    if (!card.isConnected) {
      grid.appendChild(card);
      initBadge(card, env);
    } else if (env.meta && env.meta.group_style === "stack") {
      // A stacked card (M8-17) rebuilds ALL its sections on every new
      // member, so the earlier badges the first initBadge ticker-ified are
      // gone -- re-stamp the ticker onto every section badge (each already
      // carries its own data-generated-at from the renderer's setBadge, so
      // initBadge honors it). A tab-group card (group_style unset) is NOT
      // re-inited: its single badge is owned by the renderer's tab machinery.
      initBadge(card, env);
    }
    registerCard(key, env, card); // M8-13: remember it for auto-refresh
  } catch (e) {
    grid.appendChild(R.errCard(key, "render failed: " + apiUrl(key) + "\n" + e.message));
  }
}

// ---- BTCo universe table (M4-7) ---------------------------------------
// Table construction + in-quadrant attach live in render.js (shared with
// preview.html -- unified view, owner ruling 2026-07-06). This page keeps
// only its transport and the producer-naming failure copy.
function btcoErr(key, e) {
  var producer = "btco.rb";
  var msg = /HTTP 404/.test(e.message)
    ? key + " -- 404 not found. Published by " + producer + "; run it, then publish."
    : "fetch/parse failed (" + e.message + "). " + key + " is published by " + producer + ".";
  return R.errCard(key, msg);
}

// Fallback-only full-width card, used when the chart:btco_table card is
// absent (e.g. a pre-chart publish): key-style title (no bubble -- the
// suite envelope carries no meta) + the ticking age badge (initBadge).
function buildBtcoCard(env) {
  var card = document.createElement("div");
  card.className = "card wide";
  var head = document.createElement("div");
  head.className = "card-head";
  var keySpan = document.createElement("span");
  keySpan.className = "key";
  keySpan.textContent = "btco:latest · universe";
  head.appendChild(keySpan);
  var badge = document.createElement("span");
  badge.className = "badge";
  head.appendChild(badge);
  card.appendChild(head);
  var companies = (env.payload && env.payload.companies) || [];
  card.appendChild(R.buildBtcoTable(companies));
  return card;
}

async function loadBtco() {
  var grid = document.getElementById("grid");
  var env;
  try {
    env = await getJSON(apiUrl("btco:latest"));
  } catch (e) {
    grid.appendChild(btcoErr("btco:latest", e));
    return;
  }
  try {
    BTCO.env = env; // M8-13: remember the last good universe for auto-refresh
    // In-quadrant attach is shared renderer behavior (round 5 ruling).
    if (!R.attachBtcoTable(grid, env)) {
      // no chart card (pre-chart publish) -- fall back to its own strip
      var card = buildBtcoCard(env);
      grid.appendChild(card);
      initBadge(card, env);
      BTCO.el = card; // fallback strip -- refresh replaces this node wholesale
    } else {
      BTCO.el = null; // table lives inside the chart:btco_table card
    }
  } catch (e) {
    grid.appendChild(R.errCard("btco:latest", "render failed: " + apiUrl("btco:latest") + "\n" + e.message));
  }
}

// ---- M8-13 auto-refresh -----------------------------------------------
// Every published key is re-pulled on its own timer so an OPEN tab
// converges to the latest publish with no reload (the gap that twice
// confused us). Cadence per key = the payload's ttl_hint_s, floored at
// 60s by R.nextDelay -- a "good for 30 min" payload is re-pulled every
// 30 min, and nothing ever polls faster than 60s (no request storm).
// generated_at is the change signal: an unchanged value rebuilds nothing.
// A failed fetch keeps the last good card silently -- the page's designed
// error cards are for the FIRST load only. Polling pauses while the tab is
// hidden (visibilitychange) and catches up on return. Display behavior
// only: no ttl_hint_s VALUE, chart spec, or publish path changes here.
var CARDS = {};        // chart key -> { env, el, group }
var GROUP_KEYS = {};   // tab_group id -> [member keys] in initial-load order
var BTCO = { env: null, el: null }; // universe table's last good env + fallback node
var HEADER = { idx: null, cadence: 60000, last: 0, timer: null };
var UNITS = [];        // one poll unit per solo card / tab-group / the table

function hidden() { return document.visibilityState === "hidden"; }
function tabPos(env) { var m = env.meta || {}; return m.tab_pos == null ? 99 : m.tab_pos; }

// Called for every chart key as it first renders (loadChart).
function registerCard(key, env, card) {
  var group = (env.meta && env.meta.tab_group) || null;
  CARDS[key] = { env: env, el: card, group: group };
  if (group) (GROUP_KEYS[group] || (GROUP_KEYS[group] = [])).push(key);
}

// Re-drop the universe table into (a rebuilt) chart:btco_table card from
// the last good BTCO.env: remove any existing table first so a refresh
// never duplicates it. Falls back to replacing a standalone strip node.
function reattachBtco() {
  if (!BTCO.env) return;
  var grid = document.getElementById("grid");
  var host = grid.querySelector('[data-key="chart:btco_table"]');
  if (host) {
    var old = host.querySelector("table.btco");
    if (old) old.parentNode.removeChild(old);
    R.attachBtcoTable(grid, BTCO.env);
    return;
  }
  if (BTCO.el && BTCO.el.parentNode) {
    var card = buildBtcoCard(BTCO.env);
    BTCO.el.parentNode.replaceChild(card, BTCO.el);
    initBadge(card, BTCO.env);
    BTCO.el = card;
  }
}

// ---- unit factories: solo chart, tab-group, universe table -------------
function soloUnit(key) {
  return {
    cadenceFn: function () { return R.nextDelay(CARDS[key].env.ttl_hint_s); },
    refresh: async function () {
      var env = await getJSON(apiUrl(key));
      if (env.generated_at === CARDS[key].env.generated_at) return; // unchanged
      var oldCard = CARDS[key].el, parent = oldCard.parentNode;
      R.releaseCard(oldCard);
      var newCard = R.buildChartCard(env, key);
      parent.replaceChild(newCard, oldCard);
      initBadge(newCard, env);
      CARDS[key] = { env: env, el: newCard, group: null };
      if (key === "chart:btco_table") reattachBtco(); // gauge rebuilt -> re-add table
    }
  };
}

function groupUnit(groupId) {
  var keys = GROUP_KEYS[groupId];
  return {
    cadenceFn: function () {
      return Math.min.apply(null, keys.map(function (k) {
        return R.nextDelay(CARDS[k].env.ttl_hint_s);
      }));
    },
    refresh: async function () {
      var envs = await Promise.all(keys.map(function (k) { return getJSON(apiUrl(k)); }));
      var changed = keys.some(function (k, i) {
        return envs[i].generated_at !== CARDS[k].env.generated_at;
      });
      if (!changed) return;
      var oldCard = CARDS[keys[0]].el, parent = oldCard.parentNode;
      R.releaseCard(oldCard);
      R.forgetGroup(groupId); // rebuild the shared card from scratch
      var newCard = null;
      keys.forEach(function (k, i) {
        newCard = R.buildChartCard(envs[i], k); // both members return the same card
        CARDS[k] = { env: envs[i], el: newCard, group: groupId };
      });
      parent.replaceChild(newCard, oldCard);
      // The default-active member (lowest tab_pos) owns the ticking badge,
      // exactly as on first load; tab clicks re-point it via the renderer.
      var active = keys.slice().sort(function (a, b) {
        return tabPos(CARDS[a].env) - tabPos(CARDS[b].env);
      })[0];
      initBadge(newCard, CARDS[active].env);
    }
  };
}

function btcoUnit() {
  return {
    cadenceFn: function () { return R.nextDelay(BTCO.env && BTCO.env.ttl_hint_s); },
    refresh: async function () {
      var env = await getJSON(apiUrl("btco:latest"));
      if (BTCO.env && env.generated_at === BTCO.env.generated_at) return;
      BTCO.env = env;
      reattachBtco();
    }
  };
}

// ---- scheduler: pause on hidden, catch up on return --------------------
function pollUnit(u) {
  if (hidden()) return; // resumeAll() reschedules when the tab returns
  Promise.resolve()
    .then(function () { return u.refresh(); })
    .catch(function () { /* silent: the last good card stays put */ })
    .then(function () {
      u.last = Date.now();
      u.cadence = u.cadenceFn();
      u.timer = setTimeout(function () { pollUnit(u); }, u.cadence);
    });
}

function pollHeader() {
  if (hidden()) return;
  Promise.resolve()
    .then(function () { return getJSON(apiUrl("index")); })
    .then(function (idx) {
      HEADER.idx = idx;
      var chips = document.getElementById("chips");
      while (chips.firstChild) chips.removeChild(chips.firstChild); // clear old dots
      buildHeader(idx); // repaint dot cluster + pub/fresh from the fresh index
    })
    .catch(function () { /* silent: last good header stays */ })
    .then(function () {
      HEADER.last = Date.now();
      HEADER.cadence = R.nextDelay(HEADER.idx ? HEADER.idx.ttl_hint_s : 60);
      HEADER.timer = setTimeout(pollHeader, HEADER.cadence);
    });
}

function addUnit(u) {
  u.last = Date.now();
  u.cadence = u.cadenceFn();
  u.timer = setTimeout(function () { pollUnit(u); }, u.cadence);
  UNITS.push(u);
}

function pauseAll() {
  UNITS.forEach(function (u) { clearTimeout(u.timer); });
  clearTimeout(HEADER.timer);
}

function resumeAll() {
  pauseAll(); // drop any pending timer so we never double-schedule
  var now = Date.now();
  UNITS.forEach(function (u) {
    var due = u.cadence - (now - u.last);
    if (due <= 0) pollUnit(u);                 // stale -> refresh immediately
    else u.timer = setTimeout(function () { pollUnit(u); }, due);
  });
  var hdue = HEADER.cadence - (now - HEADER.last);
  if (hdue <= 0) pollHeader();
  else HEADER.timer = setTimeout(pollHeader, hdue);
}

// Build one poll unit per solo card, per tab-group, and for the table,
// plus the header poller, then arm the visibility pause/resume.
function startAutoRefresh() {
  Object.keys(CARDS).forEach(function (key) {
    var c = CARDS[key];
    if (c.group) { if (GROUP_KEYS[c.group][0] === key) addUnit(groupUnit(c.group)); }
    else addUnit(soloUnit(key));
  });
  if (BTCO.env || BTCO.el) addUnit(btcoUnit());
  HEADER.last = Date.now();
  HEADER.cadence = R.nextDelay(HEADER.idx ? HEADER.idx.ttl_hint_s : 60);
  HEADER.timer = setTimeout(pollHeader, HEADER.cadence);
  document.addEventListener("visibilitychange", function () {
    if (hidden()) pauseAll(); else resumeAll();
  });
}

// ---- boot -------------------------------------------------------------
(async function () {
  if (typeof echarts === "undefined") {
    var b = document.getElementById("banner");
    b.style.display = "block";
    b.textContent = "ECharts CDN unreachable -- the dashboard needs network for the one pinned script.";
    return;
  }
  var healthzOk = await probeHealthz();
  var idx;
  try {
    idx = await getJSON(apiUrl("index"));
  } catch (e) {
    showBanner();
    return;
  }
  HEADER.idx = idx; // seed the header poller with the first index
  var chartKeys = buildHeader(idx);
  // An index without chart:* keys is a publish older than the chart
  // pipeline -- render the reason, not a bare page (Gate 4 lesson).
  if (!chartKeys.length) {
    var eb = document.getElementById("banner");
    eb.style.display = "block";
    eb.textContent = "The published index lists no chart:* keys -- KV holds a publish " +
                     "older than the chart pipeline. Run: PUBLISH_DRY_RUN=0 ruby publish/publish.rb " +
                     "(expect PUB LIVE 25/25), then reload.";
  }
  for (var i = 0; i < chartKeys.length; i += 1) {
    await loadChart(chartKeys[i]);
  }
  await loadBtco(); // the literal universe table, INSIDE the btco quadrant
  if (!healthzOk) showBanner(); // index served (maybe cached) but worker probe failed
  setInterval(tickAll, 1000);   // the signature -- ONE interval for the page
  startAutoRefresh();           // M8-13: per-key re-fetch so the tab converges live
  window.addEventListener("resize", function () {
    R.charts.forEach(function (c) { c.resize(); });
  });
})();
</script>
