name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu = the always-on oracle; macos-latest = Apple Silicon,
        # the actual target architecture. stdlib-only: nothing to bundle.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: rake compat
      - run: rake test
      # Worker API tests (M4-1): node's built-in runner, zero npm --
      # runners ship node preinstalled; the task WARN-skips without it
      - run: rake web:test
